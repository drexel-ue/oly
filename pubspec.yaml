name: oly
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^8.2.1
  intl: ^0.20.3
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  flutter_local_notifications: ^18.0.1
  vibration: ^2.0.1
  timezone: ^0.10.1
  flutter_timezone: ^3.0.1
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  http: ^1.2.2
  openfoodfacts: ^3.30.2
  mobile_scanner: ^7.4.0

  nested: any
  pdf: ^3.13.0
  printing: ^5.15.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  path: ^1.9.1
  wakelock_plus: ^1.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  openfoodfacts_flutter_lints:
    git:
      url: https://github.com/openfoodfacts/openfoodfacts_flutter_lints.git
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  golden_toolkit: ^0.15.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.jpg"

flutter_native_splash:
  color: "#121212"
  image: "assets/icon/splash.jpg"
  fullscreen: true
  android_12:
    image: "assets/icon/splash.jpg"
    color: "#121212"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.jpg
    - assets/icon/splash.jpg
    - assets/sounds/timer_beep.wav
    - assets/data/staple_foods.json
    - assets/data/restaurant_foods.json
    - assets/data/usda_foods.db
    - assets/data/sports_injuries_catalog.json
    - assets/fonts/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
        - asset: assets/fonts/FiraCode-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/FiraCode-Bold.ttf
          weight: 700
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf


